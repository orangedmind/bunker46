# Baut die Bunker46-Images direkt aus dem Original-Repo (dsbaars/bunker46)
# und veröffentlicht sie in der GitHub Container Registry dieses Accounts.
# Gebaut wird nur, wenn es upstream einen neuen Commit gibt.
#
# Ergebnis:
#   ghcr.io/<account>/bunker46-server:latest   (+ :<upstream-sha>)
#   ghcr.io/<account>/bunker46-web:latest      (+ :<upstream-sha>)

name: Build Bunker46 images

on:
  schedule:
    - cron: "17 3 * * *"   # täglich 03:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream-Branch, -Tag oder -Commit"
        default: "main"
      force:
        description: "Auch bauen, wenn dieser Stand schon existiert"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

env:
  UPSTREAM: dsbaars/bunker46

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Upstream auschecken
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.ref || 'main' }}
          path: src

      - name: Namen und Upstream-Stand ermitteln
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prüfen, ob dieser Stand schon gebaut wurde
        id: check
        run: |
          img="ghcr.io/${{ steps.meta.outputs.owner }}/bunker46-server:${{ steps.meta.outputs.sha }}"
          if [ "${{ inputs.force }}" != "true" ] && docker manifest inspect "$img" > /dev/null 2>&1; then
            echo "Upstream-Stand ${{ steps.meta.outputs.sha }} existiert bereits – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Buildx einrichten
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Server-Image bauen und pushen
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bunker46-server:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/bunker46-server:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.title=bunker46-server
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Web-Image bauen und pushen
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bunker46-web:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/bunker46-web:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.title=bunker46-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
